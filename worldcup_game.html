<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최애 혜택 매치! 카드 월드컵 — 카드 파이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css');
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --txt: #0f172a;
      --muted: #64748b;
      --brand: #145CE6;
      --brand-deep: #0E47C0;
      --brand-light: #e8f0fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg);
      color: var(--txt);
      line-height: 1.6;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'GmarketSans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gnb a {
      color: var(--txt);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      margin-left: 24px;
      transition: color 0.2s;
    }
    .gnb a:hover {
      color: var(--brand);
    }
    .game-container {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .game-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }
    .game-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'GmarketSans', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--txt);
      margin-bottom: 16px;
    }
    .game-desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .start-btn {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 12px;
      transition: all 0.2s;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20, 92, 230, 0.3);
    }
    .start-btn:hover {
      background: var(--brand-deep);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(20, 92, 230, 0.4);
    }
    .back-link {
      display: block;
      margin-top: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--txt);
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="index.html" class="logo">🥊 카드 파이터</a>
    <nav class="gnb">
      <a href="index.html">홈</a>
      <a href="cardlab.html">카드 연구소</a>
    </nav>
  </div>
</header>

<main class="game-container">
  <div class="game-box">
    <div class="game-icon">🏆</div>
    <h1>최애 혜택 매치! 카드 월드컵</h1>
    <p class="game-desc">
      당신이 가장 포기하기 힘든 혜택은 무엇인가요?<br>
      주유, 통신, 마트, 카페, 항공 마일리지 등 다양한 영역의 혜택을 가진 실시간 카드 혜택들을 1:1로 맞붙여 최종 1위를 가려보세요!
    </p>
    <a href="#" class="start-btn" onclick="alert('게임 준비 중입니다! 곧 출시됩니다.')">게임 시작하기</a>
    <a href="cardlab.html" class="back-link">← 카드 연구소로 돌아가기</a>
  </div>
</main>

</body>
</html>
