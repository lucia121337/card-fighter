<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최애 혜택 매치! 카드 월드컵 — 카드 파이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css');
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --txt: #0f172a;
      --muted: #64748b;
      --brand: #145CE6;
      --brand-deep: #0E47C0;
      --brand-light: #e8f0fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'GmarketSans', 'Noto Sans KR', sans-serif;
      background-color: var(--bg);
      color: var(--txt);
      line-height: 1.6;
    }
    @view-transition{navigation:auto}
    header{view-transition-name:site-header;position:sticky;top:0;z-index:100;background:rgba(255,255,255,.93);
           backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 22px}
    .header-top{display:flex;align-items:center;flex-wrap:nowrap;max-width:1200px;margin:0 auto}
    .brand-left{display:flex;align-items:center;gap:12px;flex-shrink:0;cursor:pointer}
    .brand-left .logo{font-size:32px;line-height:1;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
    .brand-left h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--txt);transition:.15s color}
    .brand-left h1:hover{color:var(--brand)}
    .gnb-divider{width:1px;height:22px;background:var(--line);margin:0 20px;flex-shrink:0}
    .gnb{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
    .gnb a{color:var(--muted);font-size:15px;font-weight:600;text-decoration:none;
           padding:7px 14px;border-radius:10px;transition:.15s background,.15s color;white-space:nowrap}
    .gnb a:hover{background:var(--brand-light);color:var(--brand)}
    .gnb a.active{background:var(--brand);color:#fff}
    @keyframes coin-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .gnb .coin-icon{display:inline-block;animation:coin-bounce 1s ease-in-out infinite;margin-right:3px}
    .header-search{flex:1;min-width:0;padding-left:20px}
    .search-box{background:var(--brand-light);border-radius:99px;padding:6px 14px 6px 20px;
      display:flex;align-items:center;width:100%;transition:.2s all;border:1.5px solid transparent}
    .search-box:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(20,92,230,.08)}
    .search-box input{flex:1;border:none;outline:none;font-family:inherit;font-size:13px;
      font-weight:500;color:var(--txt);background:transparent}
    .search-box input::placeholder{color:#94a3b8;font-weight:400}
    .search-box .search-divider{width:1px;height:22px;background:var(--line);flex-shrink:0}
    .search-box .search-btn{display:flex;align-items:center;justify-content:center;
      width:48px;height:100%;background:none;border:none;cursor:pointer;
      color:var(--muted);flex-shrink:0;transition:.15s color}
    .search-box .search-btn:hover{color:var(--brand)}
    .search-box .search-btn svg{width:20px;height:20px}
    .game-container {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .game-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }
    .game-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'GmarketSans', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--txt);
      margin-bottom: 16px;
    }
    .game-desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .start-btn {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 12px;
      transition: all 0.2s;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20, 92, 230, 0.3);
    }
    .start-btn:hover {
      background: var(--brand-deep);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(20, 92, 230, 0.4);
    }
    .back-link {
      display: block;
      margin-top: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--txt);
    }

    /* ── 플로팅 버블(비교함) ── */
    #compare-bubble{position:fixed;bottom:28px;right:28px;z-index:200;display:none}
    #compare-bubble.visible{display:block}
    .bubble-wrap{position:relative;display:inline-block}
    .bubble-btn{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;
          border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;
          justify-content:center;box-shadow:0 6px 24px rgba(20,92,230,.4);
          font-family:inherit;transition:.15s transform}
    .bubble-btn:hover{transform:scale(1.08)}
    .bubble-badge{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;
          background:#ef4444;color:#fff;font-size:11px;font-weight:800;
          display:flex;align-items:center;justify-content:center;border:2px solid #fff}
    #compare-popup{position:fixed;bottom:98px;right:28px;z-index:199;
          background:#fff;border-radius:20px;padding:20px;width:420px;
          box-shadow:0 12px 48px rgba(0,0,0,.18);display:none;
          border:1.5px solid var(--line)}
    #compare-popup.visible{display:block}
    .popup-title{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:14px;
          display:flex;align-items:center;justify-content:space-between}
    .popup-slots{display:flex;gap:10px;margin-bottom:14px}
    .popup-slot{flex:1;border:1.5px dashed var(--line);border-radius:14px;
          padding:12px 8px;display:flex;flex-direction:column;align-items:center;
          gap:6px;min-height:100px;position:relative;background:var(--bg)}
    .popup-slot.filled{border-style:solid;border-color:var(--brand);background:#fff}
    .popup-slot img{width:64px;height:40px;object-fit:contain;border-radius:6px}
    .popup-slot .ps-name{font-size:11px;font-weight:700;color:var(--txt);
          text-align:center;line-height:1.4;word-break:keep-all}
    .popup-slot .ps-remove{position:absolute;top:-7px;right:-7px;width:20px;height:20px;
          border-radius:50%;background:#ef4444;color:#fff;border:none;cursor:pointer;
          font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .popup-slot.empty{cursor:pointer;border-style:dashed;transition:.14s border-color;
          justify-content:center}
    .popup-slot.empty:hover{border-color:var(--brand)}
    .popup-slot .ps-plus{font-size:28px;color:#cbd5e1;line-height:1;margin-bottom:2px}
    .popup-slot .ps-label{font-size:11px;color:var(--muted)}
    .popup-actions{display:flex;gap:8px}
    .popup-reset{flex:1;background:none;border:1.5px solid var(--line);border-radius:10px;
          padding:9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);
          font-family:inherit;transition:.14s}
    .popup-reset:hover{border-color:var(--brand);color:var(--brand)}
    .popup-compare{flex:2;background:var(--brand);color:#fff;border:none;border-radius:10px;
          padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
          box-shadow:0 2px 8px rgba(20,92,230,.3);transition:.14s background}
    .popup-compare:hover{background:var(--brand-deep)}
    .popup-compare:disabled{opacity:.4;cursor:not-allowed;background:#94a3b8}
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-left" onclick="location.href='/'">
      <span class="logo" role="img" aria-label="카드 파이터 로고">🥊</span>
      <h1>카드 파이터</h1>
    </div>
    <div class="gnb-divider"></div>
    <nav class="gnb">
      <a href="/">홈</a>
      <a href="/card">전체카드</a>
      <a href="/event"><span class="coin-icon">🪙</span>캐시백</a>
      <a href="/shopping">할인가맹점</a>
      <a href="/cardlab" class="active">카드 연구소</a>
    </nav>
    <div class="header-search">
      <div class="search-box">
        <input id="q" type="text" placeholder="스타벅스, 주유비 등 관심 혜택을 검색해보세요!" onkeydown="if(event.key==='Enter') doGlobalSearch()" />
        <div class="search-divider"></div>
        <button class="search-btn" onclick="doGlobalSearch()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M15.5 15.5L20.5 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="game-container">
  <div class="game-box">
    <div class="game-icon">🏆</div>
    <h1>최애 혜택 매치! 카드 월드컵</h1>
    <p class="game-desc">
      당신이 가장 포기하기 힘든 혜택은 무엇인가요?<br>
      주유, 통신, 마트, 카페, 항공 마일리지 등 다양한 영역의 혜택을 가진 실시간 카드 혜택들을 1:1로 맞붙여 최종 1위를 가려보세요!
    </p>
    <a href="tournament.html" class="start-btn">게임 시작하기</a>
    <a href="/cardlab" class="back-link">← 카드 연구소로 돌아가기</a>
  </div>
</main>

<!-- 플로팅 버블(비교함) -->
<div id="compare-bubble">
  <div class="bubble-wrap">
    <button class="bubble-btn" onclick="togglePopup()">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="7" x2="21" y2="7"/>
        <path d="M6 7l-3 7a3 3 0 0 0 6 0L6 7z"/><path d="M18 7l-3 7a3 3 0 0 0 6 0L18 7z"/>
      </svg>
    </button>
    <span class="bubble-badge" id="bubble-badge">0</span>
  </div>
</div>

<!-- 비교 팝업 -->
<div id="compare-popup">
  <div class="popup-title">
    <span>비교함</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="popup-count" style="color:var(--brand)"></span>
      <button onclick="togglePopup()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:0">✕</button>
    </div>
  </div>
  <div class="popup-slots" id="popup-slots"></div>
  <div class="popup-actions">
    <button class="popup-reset" onclick="resetCompare()">초기화</button>
    <button class="popup-compare" id="popup-compare-btn" onclick="goCompare()" disabled>비교하기</button>
  </div>
</div>

<script>
function doGlobalSearch() {
  const query = document.getElementById('q').value.trim();
  if (query) {
    location.href = `/search?q=${encodeURIComponent(query)}`;
  }
}

/* ── 비교함(플로팅 버블) ── */
const escBubble = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let compareList = JSON.parse(localStorage.getItem('compareList')||'[]');
function saveCompare(){ localStorage.setItem('compareList', JSON.stringify(compareList)); }
let popupOpen = false;
function togglePopup(){
  popupOpen = !popupOpen;
  document.getElementById('compare-popup').classList.toggle('visible', popupOpen);
}
function updateCompareBubble(){
  document.getElementById('compare-bubble').classList.add('visible');
  document.getElementById('bubble-badge').textContent = compareList.length;
  const pslots = Array.from({length:3},(_,i)=>{
    const c = compareList[i];
    if(c) return `<div class="popup-slot filled">
      <img src="${escBubble(c.img||'')}" alt="" onerror="this.style.visibility='hidden'">
      <span class="ps-name">${escBubble(c.name)}</span>
      <button class="ps-remove" onclick="toggleCompareEntry(${c.idx})">×</button>
    </div>`;
    return `<div class="popup-slot empty" onclick="location.href='/card'">
      <span class="ps-plus">+</span>
      <span class="ps-label">카드 추가</span>
    </div>`;
  }).join('');
  document.getElementById('popup-slots').innerHTML = pslots;
  document.getElementById('popup-count').textContent = `${compareList.length}/3`;
  document.getElementById('popup-compare-btn').disabled = compareList.length < 2;
}
function toggleCompareEntry(idx){
  const i = compareList.findIndex(c=>c.idx===idx);
  if(i > -1) compareList.splice(i,1);
  saveCompare();
  updateCompareBubble();
}
function resetCompare(){
  compareList = [];
  saveCompare();
  updateCompareBubble();
}
function goCompare(){
  if(compareList.length < 2) return;
  const slot = compareList.map(c=>c.idx).join(',');
  window.open(`/compare/${slot}`, '_blank');
}
updateCompareBubble();
</script>
</body>
</html>
