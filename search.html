<!DOCTYPE html>
<html lang="ko">
<head>
<base href="/">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검색 결과 — 카드 파이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @import url('https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css');
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel2:#e8f0fd; --line:#e2e8f0;
    --txt:#1e293b; --muted:#64748b; --brand:#145CE6; --brand-deep:#0E47C0;
    --shadow:0 4px 18px rgba(20,92,230,.07);
  }
  *{box-sizing:border-box}
  html{overflow-y:scroll}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:99px}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"GmarketSans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}

  @view-transition{navigation:auto}
  header{view-transition-name:site-header;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 22px}
  .header-top{display:flex;align-items:center;flex-wrap:nowrap;max-width:1200px;margin:0 auto}
  .brand-left{display:flex;align-items:center;gap:12px;flex-shrink:0;cursor:pointer}
  .brand-left .logo{font-size:32px;line-height:1;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
  .brand-left h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--txt);transition:.15s color}
  .brand-left h1:hover{color:var(--brand)}
  .gnb-divider{width:1px;height:22px;background:var(--line);margin:0 20px;flex-shrink:0}
  .gnb{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .gnb a{color:var(--muted);font-size:15px;font-weight:600;text-decoration:none;
         padding:7px 14px;border-radius:10px;transition:.15s background,.15s color;white-space:nowrap}
  .gnb a:hover{background:var(--panel2);color:var(--brand)}
  .gnb a.active{background:var(--brand);color:#fff}
  @keyframes coin-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .gnb .coin-icon{display:inline-block;animation:coin-bounce 1s ease-in-out infinite;margin-right:3px}
  .header-search{flex:1;min-width:0;padding-left:20px}
  .search-box{background:var(--panel2);border-radius:99px;padding:6px 14px 6px 20px;
    display:flex;align-items:center;width:100%;transition:.2s all;border:1.5px solid transparent}
  .search-box:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(20,92,230,.08)}
  .search-box input{flex:1;border:none;outline:none;font-family:inherit;font-size:13px;
    font-weight:500;color:var(--txt);background:transparent}
  .search-box input::placeholder{color:#94a3b8;font-weight:400}
  .search-box .search-divider{width:1px;height:22px;background:var(--line);flex-shrink:0}
  .search-box .search-btn{display:flex;align-items:center;justify-content:center;
    width:48px;height:100%;background:none;border:none;cursor:pointer;
    color:var(--muted);flex-shrink:0;transition:.15s color}
  .search-box .search-btn:hover{color:var(--brand)}
  .search-box .search-btn svg{width:20px;height:20px}

  main{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
  .sr-summary{font-size:16px;font-weight:700;color:var(--txt);margin:0 0 28px;text-align:center}
  .sr-summary b{color:var(--brand)}
  .sr-empty{text-align:center;color:var(--muted);padding:80px 0;font-size:15px}

  .sr-section{margin-bottom:36px}
  .sr-section-title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;margin:0 0 14px}
  .sr-section-title .cnt{color:var(--brand)}

  .sr-row{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:inherit;
    transition:.15s box-shadow,.15s border-color}
  .sr-row:hover{box-shadow:var(--shadow);border-color:var(--brand)}
  .sr-row img{width:52px;height:34px;object-fit:contain;border-radius:6px;background:var(--bg);
    border:1px solid var(--line);flex-shrink:0}
  .sr-row-icon{width:52px;height:34px;border-radius:6px;background:var(--panel2);display:flex;
    align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .sr-row-body{flex:1;min-width:0}
  .sr-row-name{font-size:15px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-row-tag{font-size:11px;font-weight:700;color:var(--brand);background:var(--panel2);
    padding:2px 8px;border-radius:99px;flex-shrink:0}
  .sr-row-arrow{color:var(--muted);font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand-left" onclick="location.href='/'">
      <span class="logo" role="img" aria-label="카드 파이터 로고">🥊</span>
      <h1>카드 파이터</h1>
    </div>
    <div class="gnb-divider"></div>
    <nav class="gnb">
      <a href="/">홈</a>
      <a href="/card">전체카드</a>
      <a href="/event"><span class="coin-icon">🪙</span>캐시백</a>
      <a href="/shopping">할인가맹점</a>
      <a href="/cardlab">카드 연구소</a>
    </nav>
    <div class="header-search">
      <div class="search-box">
        <input id="q" type="text" placeholder="스타벅스, 주유비 등 관심 혜택을 검색해보세요!" onkeydown="if(event.key==='Enter') doGlobalSearch()" />
        <div class="search-divider"></div>
        <button class="search-btn" onclick="doGlobalSearch()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M15.5 15.5L20.5 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <div class="sr-empty"><div class="spinner"></div>검색 중…</div>
</main>

<script>
function doGlobalSearch(){
  const query = document.getElementById('q').value.trim();
  if (query) location.href = `/search?q=${encodeURIComponent(query)}`;
}

function stripHtml(s){ return String(s||'').replace(/<[^>]+>/g,' '); }

async function runSearch(query){
  const q = query.trim().toLowerCase();
  document.getElementById('q').value = query;
  if (!q) { renderResults(query, [], [], [], []); return; }

  const [cardsRes, productsRes] = await Promise.all([
    fetch('/cards_list.json').then(r=>r.json()).catch(()=>[]),
    fetch('/data/naver_products.json').then(r=>r.json()).catch(()=>[]),
  ]);

  /* 1) 카드: 이름/카드사/혜택카테고리/혜택요약에서 검색 */
  const cardMatches = cardsRes.filter(c => {
    const hay = [c.card_name, c.company, c.benefit_categories, c.top_benefit_summary, stripHtml(c.detailed_benefits)]
      .join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(0, 30);

  /* 2) 캐시백: 카드사/카드명에서 검색 */
  const cashbackMatches = [];
  for (const [platform, data] of Object.entries(CASHBACK)) {
    for (const company of (data.companies||[])) {
      const companyHit = company.name.toLowerCase().includes(q);
      for (const card of (company.cards||[])) {
        if (companyHit || card.name.toLowerCase().includes(q)) {
          cashbackMatches.push({ platform, platformUrl: data.url, company: company.name, card });
        }
      }
    }
  }

  /* 3) 할인가맹점: 몰 이름/상품명에서 검색 */
  const productMatches = productsRes.filter(p => {
    const hay = (String(p[0]||'') + ' ' + String(p[1]||'')).toLowerCase();
    return hay.includes(q);
  }).slice(0, 30);

  /* 4) 카드연구소 콘텐츠 */
  const contentMatches = CARDLAB_CONTENT.filter(c =>
    c.title.toLowerCase().includes(q) || c.keywords.some(k => k.includes(q) || q.includes(k))
  );

  renderResults(query, cardMatches, cashbackMatches, productMatches, contentMatches);
}

function renderResults(query, cards, cashback, products, contents){
  const total = cards.length + cashback.length + products.length + contents.length;
  const main = document.getElementById('main');

  if (!query.trim()) {
    main.innerHTML = '<div class="sr-empty">검색어를 입력해주세요.</div>';
    return;
  }
  if (total === 0) {
    main.innerHTML = `<p class="sr-summary">'<b>${esc(query)}</b>'에 대한 검색 결과가 없어요.</p>
      <div class="sr-empty">다른 키워드로 다시 검색해보세요.</div>`;
    return;
  }

  let html = `<p class="sr-summary">'<b>${esc(query)}</b>'에 대해 카드 ${cards.length}건, 캐시백 ${cashback.length}건,
    할인가맹점 ${products.length}건, 콘텐츠 ${contents.length}건을 찾았습니다.</p>`;

  if (cards.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">💳 카드 <span class="cnt">${cards.length}</span></h2>`;
    html += cards.map(c => `
      <a class="sr-row" href="/detail/${c.idx}">
        <img src="${esc(c.card_img||'')}" alt="" onerror="this.style.visibility='hidden'">
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(c.card_name)}</div>
          <div class="sr-row-sub">${esc(c.company)} · ${esc(c.top_benefit_summary||'')}</div>
        </div>
        <span class="sr-row-arrow">›</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (cashback.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🪙 캐시백 <span class="cnt">${cashback.length}</span></h2>`;
    html += cashback.map(m => `
      <a class="sr-row" href="${esc(m.card.url || m.platformUrl)}" target="_blank" rel="noopener">
        <div class="sr-row-icon">🪙</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(m.card.name)}</div>
          <div class="sr-row-sub">${esc(m.platform)} · ${esc(m.company)}${m.card.amount ? ' · 최대 '+m.card.amount+'만원' : ''}</div>
        </div>
        <span class="sr-row-tag">바로가기 ↗</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (products.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🛍️ 할인가맹점 <span class="cnt">${products.length}</span></h2>`;
    html += products.map(p => `
      <a class="sr-row" href="${esc(p[6]||'#')}" target="_blank" rel="noopener">
        <div class="sr-row-icon">🛍️</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(p[1])}</div>
          <div class="sr-row-sub">${esc(p[0])} · ${esc(p[2]||'')}${p[3] ? ' · '+Number(p[3]).toLocaleString()+'원' : ''}</div>
        </div>
        <span class="sr-row-tag">보러가기 ↗</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (contents.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🔬 카드연구소 <span class="cnt">${contents.length}</span></h2>`;
    html += contents.map(c => `
      <a class="sr-row" href="${c.url}">
        <div class="sr-row-icon">${c.icon}</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(c.title)}</div>
          <div class="sr-row-sub">${esc(c.sub)}</div>
        </div>
        <span class="sr-row-tag">${esc(c.tag)}</span>
      </a>`).join('');
    html += `</div>`;
  }

  main.innerHTML = html;
}

const initialQuery = new URLSearchParams(location.search).get('q') || '';
runSearch(initialQuery);
</script>
</body>
</html>
