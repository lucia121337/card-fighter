function stripHtml(s){ return String(s||'').replace(/<[^>]+>/g,' '); }

/* ============================================================
   검색어 기반 추천 시스템 — TF-IDF(텍스트 빈도)와 BERT(문장임베딩) 두 방식의
   후보를 섞어(interleave) 하나의 목록 5개로 노출한다 (UI에는 방식 구분 없음).
   ============================================================ */

/* 검색된(1순위 매칭) 카드와 "혜택이 비슷한" 카드 5개 — 둘 다 카드 대 카드 비교라
   card_tfidf_index.json/card_bert_embeddings.json에 미리 계산해 둔 벡터끼리 코사인
   유사도만 내면 돼서, 검색어를 다시 임베딩할 필요가 없다(모델 로드/추론 불필요). */
function tfidfCardSimilar(idx, tfidfIndex, topN){
  if (!tfidfIndex || !tfidfIndex.cards) return [];
  const target = tfidfIndex.cards.find(c => c.idx === idx);
  if (!target) return [];
  const scored = tfidfIndex.cards.filter(c => c.idx !== idx).map(c => {
    const [small, big] = Object.keys(target.vec).length < Object.keys(c.vec).length
      ? [target.vec, c.vec] : [c.vec, target.vec];
    let sum = 0;
    for (const term in small) { if (big[term]) sum += small[term] * big[term]; }
    return { c, score: sum };
  }).filter(s => s.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topN).map(s => s.c);
}

function bertCardSimilar(idx, bertData, topN){
  if (!bertData || !bertData.cards) return [];
  const target = bertData.cards.find(c => c.idx === idx);
  if (!target) return [];
  const te = target.embedding;
  const scored = bertData.cards.filter(c => c.idx !== idx).map(c => {
    const e = c.embedding;
    let sum = 0;
    for (let i = 0; i < te.length; i++) sum += te[i] * e[i];
    return { c, score: sum };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topN).map(s => s.c);
}

// TF-IDF/BERT 두 방식의 후보를 번갈아 섞어(interleave) 중복 제거 후 topN만 남긴다.
function mergeCardSimilar(idx, tfidfIndex, bertData, topN){
  const tfidfTop = tfidfCardSimilar(idx, tfidfIndex, topN * 2);
  const bertTop = bertCardSimilar(idx, bertData, topN * 2);
  const merged = [];
  const seen = new Set([idx]);
  const maxLen = Math.max(tfidfTop.length, bertTop.length);
  for (let i = 0; i < maxLen && merged.length < topN; i++) {
    for (const c of [bertTop[i], tfidfTop[i]]) {
      if (c && !seen.has(c.idx)) { seen.add(c.idx); merged.push(c); }
      if (merged.length >= topN) break;
    }
  }
  return merged;
}

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* "혹시 이 카드를 찾으셨나요?" — 편집거리 기반 유사 카드명 매칭 */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}
/* 2벌식 자판 매핑 — 한글을 의도했지만 영문 상태로 입력된 오타("dkwjdekd" 등)를
   실제 한글("아정당")로 복원해서 같은 파이프라인으로 비교할 수 있게 한다. */
const KEY_JAMO = {
  q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅐ',p:'ㅔ',
  a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',
  z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ',
  Q:'ㅃ',W:'ㅉ',E:'ㄸ',R:'ㄲ',T:'ㅆ',O:'ㅒ',P:'ㅖ',
};
const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_SET = new Set(CHO_LIST);
const JUNG_SET = new Set(JUNG_LIST);

function composeHangul(cho, jung, jong){
  const ci = CHO_LIST.indexOf(cho), vi = JUNG_LIST.indexOf(jung), fi = JONG_LIST.indexOf(jong || '');
  if (ci < 0 || vi < 0 || fi < 0) return cho + jung + jong;
  return String.fromCharCode(0xAC00 + (ci * 21 + vi) * 28 + fi);
}

// 영문 오타 → 자모 시퀀스 → 한글 음절로 조합. 자모로 못 바꾸거나 초성+중성 규칙에
// 안 맞는 글자가 하나라도 있으면 애초에 한글 오타가 아니라고 보고 null을 반환한다.
function decodeKeyboardTypo(str){
  const jamos = [...str].map(ch => KEY_JAMO[ch]);
  if (jamos.some(j => !j)) return null;
  let out = '', i = 0;
  while (i < jamos.length) {
    if (!CHO_SET.has(jamos[i])) return null;
    const cho = jamos[i++];
    if (i >= jamos.length || !JUNG_SET.has(jamos[i])) return null;
    const jung = jamos[i++];
    let jong = '';
    if (i < jamos.length && CHO_SET.has(jamos[i]) && !(i + 1 < jamos.length && JUNG_SET.has(jamos[i + 1]))) {
      jong = jamos[i++];
    }
    out += composeHangul(cho, jung, jong);
  }
  return out;
}

// 카드명 전체가 아니라 "단어(토큰) 단위"로도 비교해서, 브랜드명만 짧게 검색해도
// ("아성당" 같은 오타 포함) "아정당 우리카드" 같은 긴 카드명을 잡아낼 수 있게 한다.
function bestNameRatio(query, name){
  let best = levenshtein(query, name) / Math.max(query.length, name.length, 1);
  for (const token of name.split(/\s+/).filter(Boolean)) {
    const ratio = levenshtein(query, token) / Math.max(query.length, token.length, 1);
    if (ratio < best) best = ratio;
  }
  return best;
}

function findSimilarCardNames(query, allCards, topN){
  const q = query.trim().toLowerCase();
  if (!q || !allCards.length) return [];
  const decoded = decodeKeyboardTypo(query.trim());
  const candidates = decoded ? [q, decoded.toLowerCase()] : [q];

  const scored = allCards.map(c => {
    const name = String(c.card_name || '').toLowerCase();
    const ratio = Math.min(...candidates.map(cand => bestNameRatio(cand, name)));
    return { c, ratio };
  });
  scored.sort((a, b) => a.ratio - b.ratio);
  return scored.filter(s => s.ratio <= 0.45).slice(0, topN).map(s => s.c);
}

const recoCardHtml = c => `
  <a class="sr-reco-card" href="/detail/${c.idx}">
    <img src="${esc(c.card_img||'')}" alt="" onerror="this.style.visibility='hidden'">
    <div class="sr-reco-name">${esc(c.card_name)}</div>
    <div class="sr-reco-company">${esc(c.company||'')}</div>
  </a>`;

/* 검색 결과 유무에 따라 완전히 다른 추천 영역을 그린다.
   - 검색결과 있음: 1순위로 매칭된 카드와 "혜택이 비슷한" 카드 5개(카드-카드 유사도)
   - 검색결과 없음 + 비슷한 카드명 있음: "혹시 이 카드를 찾으셨나요?" 목록만
   - 검색결과 없음 + 비슷한 카드명도 없음: 전체카드 중 랜덤 5개(볼 때마다 다시 셔플) */
function renderRecoArea(query, cardMatches){
  const allCards = window.__ALL_CARDS || [];
  const tfidfIndex = window.__TFIDF_INDEX;
  const bertData = window.__BERT_DATA;
  const container = document.getElementById('reco-area');
  if (!container || !query.trim()) return;

  if (cardMatches.length) {
    const merged = mergeCardSimilar(cardMatches[0].idx, tfidfIndex, bertData, 5);
    container.innerHTML = merged.length ? `
      <div class="sr-section sr-reco">
        <h2 class="sr-section-title">✨ 이런 카드도 있어요!</h2>
        <div class="sr-reco-grid">${merged.map(recoCardHtml).join('')}</div>
      </div>` : '';
    return;
  }

  const guesses = findSimilarCardNames(query, allCards, 5);
  if (guesses.length) {
    container.innerHTML = `
      <div class="sr-section sr-guess">
        <h2 class="sr-section-title">🔍 혹시 이 카드를 찾으셨나요?</h2>
        ${guesses.map(c => `
          <a class="sr-row" href="/detail/${c.idx}">
            <img src="${esc(c.card_img||'')}" alt="" onerror="this.style.visibility='hidden'">
            <div class="sr-row-body">
              <div class="sr-row-name">${esc(c.card_name)}</div>
              <div class="sr-row-sub">${esc(c.company||'')}</div>
            </div>
            <span class="sr-row-arrow">›</span>
          </a>`).join('')}
      </div>`;
    return;
  }

  const randomFive = shuffle(allCards).slice(0, 5);
  container.innerHTML = randomFive.length ? `
    <div class="sr-section sr-reco">
      <h2 class="sr-section-title">✨ 이런 카드는 어떠세요?</h2>
      <div class="sr-reco-grid">${randomFive.map(recoCardHtml).join('')}</div>
    </div>` : '';
}

async function runSearch(query){
  const q = query.trim().toLowerCase();
  document.getElementById('q').value = query;
  if (!q) { renderResults(query, [], [], [], []); return; }

  const [cardsRes, productsRes, tfidfIndex, bertData] = await Promise.all([
    fetch('/cards_list.json').then(r=>r.json()).catch(()=>[]),
    fetch('/data/naver_products.json').then(r=>r.json()).catch(()=>[]),
    fetch('/data/card_tfidf_index.json').then(r=>r.json()).catch(()=>null),
    fetch('/data/card_bert_embeddings.json').then(r=>r.json()).catch(()=>null),
  ]);
  window.__ALL_CARDS = cardsRes;
  window.__TFIDF_INDEX = tfidfIndex;
  window.__BERT_DATA = bertData;

  /* 1) 카드: 이름/카드사/혜택카테고리/혜택요약에서 검색 */
  const cardMatches = cardsRes.filter(c => {
    const hay = [c.card_name, c.company, c.benefit_categories, c.top_benefit_summary, stripHtml(c.detailed_benefits)]
      .join(' ').toLowerCase();
    return hay.includes(q);
  }).slice(0, 30);

  /* 2) 캐시백: 카드사/카드명에서 검색 */
  const cashbackMatches = [];
  for (const [platform, data] of Object.entries(CASHBACK)) {
    for (const company of (data.companies||[])) {
      const companyHit = company.name.toLowerCase().includes(q);
      for (const card of (company.cards||[])) {
        if (companyHit || card.name.toLowerCase().includes(q)) {
          cashbackMatches.push({ platform, platformUrl: data.url, company: company.name, card });
        }
      }
    }
  }

  /* 3) 할인가맹점: 몰 이름/상품명에서 검색 */
  const productMatches = productsRes.filter(p => {
    const hay = (String(p[0]||'') + ' ' + String(p[1]||'')).toLowerCase();
    return hay.includes(q);
  }).slice(0, 30);

  /* 4) 카드연구소 콘텐츠 */
  const contentMatches = CARDLAB_CONTENT.filter(c =>
    c.title.toLowerCase().includes(q) || c.keywords.some(k => k.includes(q) || q.includes(k))
  );

  renderResults(query, cardMatches, cashbackMatches, productMatches, contentMatches);
}

function renderResults(query, cards, cashback, products, contents){
  const total = cards.length + cashback.length + products.length + contents.length;
  const main = document.getElementById('main');

  if (!query.trim()) {
    main.innerHTML = '<div class="sr-empty">검색어를 입력해주세요.</div>';
    return;
  }
  if (total === 0) {
    main.innerHTML = `<p class="sr-summary">'<b>${esc(query)}</b>'에 대한 검색 결과가 없어요.</p>
      <div id="reco-area"></div>`;
    renderRecoArea(query, cards);
    return;
  }

  let html = `<p class="sr-summary">'<b>${esc(query)}</b>'에 대해 카드 ${cards.length}건, 캐시백 ${cashback.length}건,
    할인가맹점 ${products.length}건, 콘텐츠 ${contents.length}건을 찾았습니다.</p>`;

  if (cards.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">💳 카드 <span class="cnt">${cards.length}</span></h2>`;
    html += cards.map(c => `
      <a class="sr-row" href="/detail/${c.idx}">
        <img src="${esc(c.card_img||'')}" alt="" onerror="this.style.visibility='hidden'">
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(c.card_name)}</div>
          <div class="sr-row-sub">${esc(c.company)} · ${esc(c.top_benefit_summary||'')}</div>
        </div>
        <span class="sr-row-arrow">›</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (cashback.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🪙 캐시백 <span class="cnt">${cashback.length}</span></h2>`;
    html += cashback.map(m => `
      <a class="sr-row" href="${esc(m.card.url || m.platformUrl)}" target="_blank" rel="noopener">
        <div class="sr-row-icon">🪙</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(m.card.name)}</div>
          <div class="sr-row-sub">${esc(m.platform)} · ${esc(m.company)}${m.card.amount ? ' · 최대 '+m.card.amount+'만원' : ''}</div>
        </div>
        <span class="sr-row-tag">바로가기 ↗</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (products.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🛍️ 할인가맹점 <span class="cnt">${products.length}</span></h2>`;
    html += products.map(p => `
      <a class="sr-row" href="${esc(p[6]||'#')}" target="_blank" rel="noopener">
        <div class="sr-row-icon">🛍️</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(p[1])}</div>
          <div class="sr-row-sub">${esc(p[0])} · ${esc(p[2]||'')}${p[3] ? ' · '+Number(p[3]).toLocaleString()+'원' : ''}</div>
        </div>
        <span class="sr-row-tag">보러가기 ↗</span>
      </a>`).join('');
    html += `</div>`;
  }

  if (contents.length) {
    html += `<div class="sr-section"><h2 class="sr-section-title">🔬 카드연구소 <span class="cnt">${contents.length}</span></h2>`;
    html += contents.map(c => `
      <a class="sr-row" href="${c.url}">
        <div class="sr-row-icon">${c.icon}</div>
        <div class="sr-row-body">
          <div class="sr-row-name">${esc(c.title)}</div>
          <div class="sr-row-sub">${esc(c.sub)}</div>
        </div>
        <span class="sr-row-tag">${esc(c.tag)}</span>
      </a>`).join('');
    html += `</div>`;
  }

  html += '<div id="reco-area"></div>';

  main.innerHTML = html;
  renderRecoArea(query, cards);
}

const initialQuery = new URLSearchParams(location.search).get('q') || '';
runSearch(initialQuery);
</script>
