<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드 유형 찾기 — 카드 파이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @import url('https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css');
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel2:#e8f0fd; --line:#e2e8f0;
    --txt:#1e293b; --muted:#64748b; --brand:#145CE6; --brand-deep:#0E47C0;
    --shadow:0 4px 18px rgba(20,92,230,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"GmarketSans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
         padding:12px 24px;display:flex;align-items:center;gap:14px}
  .back{display:inline-flex;align-items:center;gap:6px;color:#fff;background:var(--brand);
        font-weight:700;font-size:13px;padding:8px 16px;border-radius:10px;
        box-shadow:0 2px 8px rgba(20,92,230,.28);transition:.15s background;white-space:nowrap}
  .back:hover{background:var(--brand-deep)}
  .header-logo{font-size:26px;line-height:1}
  .header-title{font-weight:800;font-size:16px;letter-spacing:-.5px}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 16px 80px}

  /* ── 히어로 ── */
  .hero{text-align:center;padding:20px 0 34px}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
        color:var(--brand);font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:99px;
        border:1px solid #bfdbfe;margin-bottom:16px}
  .hero h1{font-size:30px;font-weight:800;margin:0 0 10px;line-height:1.3;letter-spacing:-1px}
  .hero h1 b{color:var(--brand)}
  .hero p{color:var(--muted);font-size:14.5px;margin:0}

  /* ── 세그먼트 그리드 ── */
  .seg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .seg-card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;
        padding:22px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:14px;
        box-shadow:var(--shadow)}
  .seg-card:hover{transform:translateY(-4px);border-color:var(--brand);
        box-shadow:0 16px 36px rgba(20,92,230,.16)}
  .seg-top{display:flex;align-items:center;gap:14px}
  .seg-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
        font-size:28px;flex-shrink:0}
  .seg-name{font-size:18px;font-weight:800;line-height:1.25}
  .seg-count{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
  .seg-count b{color:var(--brand);font-size:15px}
  .seg-desc{font-size:13px;color:#475569;line-height:1.55;min-height:40px}
  .seg-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;
        background:var(--panel2);color:var(--brand);border:1px solid #bfdbfe}
  .chip.plain{background:#f1f5f9;color:var(--muted);border-color:var(--line)}
  .seg-thumbs{display:flex;gap:8px;margin-top:2px}
  .seg-thumbs img{width:52px;height:34px;object-fit:contain;background:var(--bg);
        border:1px solid var(--line);border-radius:7px;padding:3px}
  .seg-go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
        font-size:13px;font-weight:800;color:var(--brand);padding-top:6px}

  /* ── 드릴(유형 상세) ── */
  .drill-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .drill-back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:800;
        font-size:13.5px;cursor:pointer}
  .drill-ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex-shrink:0}
  .drill-title{font-size:22px;font-weight:800}
  .drill-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .mini{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;
        transition:.15s;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
  .mini:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 26px rgba(20,92,230,.14)}
  .mini img{width:100%;height:96px;object-fit:contain;background:var(--bg);border-radius:10px;
        border:1px solid var(--line);padding:8px}
  .mini .m-name{font-size:14px;font-weight:800;line-height:1.3;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini .m-corp{font-size:12px;color:var(--muted);font-weight:600}
  .mini .m-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .mini .m-fee{font-size:11.5px;color:var(--muted);font-weight:700}
  .mini .m-link{font-size:12px;font-weight:800;color:var(--brand)}

  .ml-note{margin-top:32px;text-align:center;color:#94a3b8;font-size:12px;line-height:1.7}
  .ml-note b{color:var(--muted)}
  .hidden{display:none}
  @media(max-width:520px){ .hero h1{font-size:24px} }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← 홈으로</a>
  <span class="header-logo" role="img" aria-label="카드 파이터">🥊</span>
  <span class="header-title">카드 파이터</span>
</header>

<div class="wrap">
  <!-- 목록 뷰 -->
  <section id="list-view">
    <div class="hero">
      <span class="eyebrow">🤖 AI 카드 유형 분석</span>
      <h1>고민 말고, <b>유형</b>으로 골라보세요</h1>
      <p>1,563장을 AI가 6가지 유형으로 묶었어요. 내 소비랑 닮은 유형을 눌러보세요.</p>
    </div>
    <div class="seg-grid" id="seg-grid"></div>
    <div class="ml-note">
      💡 6개 유형은 카드 <b>혜택·연회비·전월실적</b>을 기준으로 <b>비지도 학습(K-평균 군집)</b>으로 자동 분류한 결과예요.
    </div>
  </section>

  <!-- 드릴 뷰 -->
  <section id="drill-view" class="hidden">
    <div class="drill-head" id="drill-head"></div>
    <div class="card-grid" id="card-grid"></div>
  </section>
</div>

<script>
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 세그먼트별 파스텔 배경(아이콘 원) — 브랜드와 조화되는 소프트 톤
const TONES = [
  {bg:'#eef2ff'}, {bg:'#ecfdf5'}, {bg:'#fff7ed'},
  {bg:'#fdf2f8'}, {bg:'#f0f9ff'}, {bg:'#f5f3ff'}
];
let SEG=null, CARDS=null, BYIDX={};

Promise.all([
  fetch('card_segments.json').then(r=>r.json()),
  fetch('cards_list.json').then(r=>r.json())
]).then(([seg,cards])=>{
  SEG=seg; CARDS=cards;
  cards.forEach(c=>BYIDX[c.idx]=c);
  renderList();
}).catch(e=>{
  document.getElementById('seg-grid').innerHTML =
    `<div style="color:#94a3b8;padding:40px;text-align:center">데이터를 불러오지 못했어요.<br><small>${esc(String(e))}</small></div>`;
});

function feeText(c){
  const m = String(c.annual_fee||'').match(/\[?([\d,]+)\]?\s*원/);
  const n = m ? +m[1].replace(/,/g,'') : 0;
  return n ? (n>=10000? Math.round(n/10000)+'만원' : n.toLocaleString()+'원') : '무료';
}

function renderList(){
  document.getElementById('seg-grid').innerHTML = SEG.segments.map((s,i)=>{
    const tone = TONES[i%TONES.length];
    const thumbs = (s.samples||[]).slice(0,3).map(idx=>{
      const c=BYIDX[idx]; return c&&c.card_img ? `<img src="${esc(c.card_img)}" alt="" onerror="this.style.display='none'">`:'';
    }).join('');
    const cats = (s.top_cats||[]).slice(0,2).map(c=>`<span class="chip">${esc(c)}</span>`).join('');
    return `<div class="seg-card" onclick="openSeg(${s.id})">
      <div class="seg-top">
        <div class="seg-ico" style="background:${tone.bg}">${s.icon}</div>
        <div>
          <div class="seg-name">${esc(s.name)}</div>
          <div class="seg-count"><b>${s.count}</b>장</div>
        </div>
      </div>
      <div class="seg-desc">${esc(s.desc)}</div>
      <div class="seg-chips">
        ${cats}
        <span class="chip plain">${esc(s.fee_label)}</span>
        <span class="chip plain">${esc(s.pre_label)}</span>
      </div>
      <div class="seg-thumbs">${thumbs}</div>
      <div class="seg-go"><span>이 유형 카드 보기</span><span>→</span></div>
    </div>`;
  }).join('');
}

function openSeg(id){
  const s = SEG.segments.find(x=>x.id===id);
  const tone = TONES[SEG.segments.indexOf(s)%TONES.length];
  const idxs = Object.keys(SEG.card_segment).filter(k=>SEG.card_segment[k]===id).map(Number);
  // 대표(센터 근접) 카드 먼저, 그다음 나머지
  const order = [...new Set([...(s.samples||[]), ...idxs])];
  document.getElementById('drill-head').innerHTML = `
    <span class="drill-back" onclick="backList()">← 유형 전체</span>
    <div class="drill-ico" style="background:${tone.bg}">${s.icon}</div>
    <div>
      <div class="drill-title">${esc(s.name)} <span style="color:var(--brand)">${s.count}장</span></div>
      <div class="drill-sub">${esc(s.desc)}</div>
    </div>`;
  document.getElementById('card-grid').innerHTML = order.map(idx=>{
    const c=BYIDX[idx]; if(!c) return '';
    return `<a class="mini" href="detail?idx=${c.idx}">
      <img src="${esc(c.card_img||'')}" alt="" onerror="this.style.visibility='hidden'">
      <div class="m-name">${esc(c.card_name)}</div>
      <div class="m-corp">${esc(c.company||'')}</div>
      <div class="m-foot"><span class="m-fee">연회비 ${esc(feeText(c))}</span><span class="m-link">상세 →</span></div>
    </a>`;
  }).join('');
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('drill-view').classList.remove('hidden');
  window.scrollTo(0,0);
}
function backList(){
  document.getElementById('drill-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
