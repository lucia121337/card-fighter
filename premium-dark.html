<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>프리미엄 카드 관 — 카드 파이터</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --line:#2a2d38; --txt:#f5f3ee;
    --muted:#9aa0ac; --gold:#c9a45c; --gold2:#e8c886;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  header{padding:46px 22px 30px;text-align:center;
    background:radial-gradient(120% 100% at 50% 0%, #1b1d26 0%, var(--bg) 70%);
    border-bottom:1px solid var(--line)}
  .kicker{letter-spacing:.35em;font-size:12px;color:var(--gold);font-weight:700}
  header h1{margin:10px 0 6px;font-size:30px;font-weight:800;
    background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:0;color:var(--muted);font-size:14px}
  .home{display:inline-block;margin-top:18px;font-size:13px;color:var(--muted);
    border:1px solid var(--line);border-radius:99px;padding:7px 16px}
  .home:hover{border-color:var(--gold);color:var(--gold)}
  .wrap{max-width:1040px;margin:0 auto;padding:34px 20px 70px}
  .count{color:var(--muted);font-size:13px;margin-bottom:18px;text-align:center}
  .count b{color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .card{background:linear-gradient(180deg,#191b23,#14151b);border:1px solid var(--line);
    border-radius:18px;padding:20px;position:relative;overflow:hidden;transition:.2s}
  .card:hover{border-color:var(--gold);transform:translateY(-3px);
    box-shadow:0 12px 34px rgba(201,164,92,.14)}
  .rank{position:absolute;top:14px;right:16px;font-size:12px;color:var(--gold);
    border:1px solid var(--gold);border-radius:99px;padding:2px 10px;letter-spacing:.05em}
  .cimg{width:100%;height:150px;object-fit:contain;margin:6px 0 14px;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  .company{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.03em}
  .name{font-size:18px;font-weight:800;margin:3px 0 12px;line-height:1.3}
  .fee{display:flex;align-items:baseline;gap:6px;border-top:1px solid var(--line);padding-top:12px}
  .fee .lbl{font-size:12px;color:var(--muted)}
  .fee .val{font-size:22px;font-weight:800;color:var(--gold2)}
  .benefit{font-size:12.5px;color:#c8ccd4;line-height:1.55;margin-top:12px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .more{display:inline-block;margin-top:14px;font-size:13px;color:var(--gold);font-weight:700}
  .more:hover{color:var(--gold2)}
  .empty{text-align:center;color:var(--muted);padding:50px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="kicker">P R E M I U M</div>
  <h1>프리미엄 카드 관</h1>
  <p>연회비 15만원 이상, 최상위 프리미엄 카드만 모았습니다.</p>
  <a class="home" href="/">← 전체 카드로 돌아가기</a>
</header>

<div class="wrap">
  <div class="count" id="count">불러오는 중…</div>
  <div class="grid" id="grid"></div>
</div>
<footer>카드 파이터 · 프리미엄 관</footer>

<script>
const THRESHOLD = 150000;   // 연회비 기준 (이상)
const won = n => (n||0).toLocaleString('ko-KR');

// 연회비: 대괄호/원 위치 무관하게 숫자(3자리+) 추출 후 최댓값
function maxFee(s){
  const m = [...(s||'').matchAll(/[\d,]{3,}/g)].map(x => +x[0].replace(/,/g,'')).filter(v => v >= 1000);
  return m.length ? Math.max(...m) : 0;
}

async function load(){
  let cards = [];
  try {
    const [cardsResRaw, activeRes] = await Promise.all([
      fetch('cards_list.json'),
      fetch('active_cards.json').catch(() => null)
    ]);
    if (!cardsResRaw.ok) throw new Error("HTTP " + cardsResRaw.status);
    let d = await cardsResRaw.json();
    if (activeRes && activeRes.ok) {
      const activeIds = await activeRes.json();
      const activeSet = new Set(activeIds.map(String));
      d = d.filter(c => activeSet.has(String(c.idx)));
    }
    cards = d;
  }
  catch(e){ document.getElementById('count').textContent = '카드 데이터를 불러오지 못했어요. (주소창이 http://localhost:… 인지 확인)'; return; }

  const premium = cards
    .map(c => ({...c, _fee: maxFee(c.annual_fee)}))
    .filter(c => c._fee >= THRESHOLD)
    .sort((a,b) => b._fee - a._fee);

  document.getElementById('count').innerHTML =
    `연회비 <b>15만원 이상</b> · 총 <b>${premium.length}</b>장`;

  document.getElementById('grid').innerHTML = premium.map((c,i) => `
    <a class="card" href="detail.html?idx=${c.idx}">
      <span class="rank">TOP ${i+1}</span>
      <img class="cimg" src="${c.card_img||''}" onerror="this.style.visibility='hidden'"/>
      <div class="company">${c.company||''}</div>
      <div class="name">${c.card_name||''}</div>
      <div class="fee"><span class="lbl">연회비</span><span class="val">${won(c._fee)}원</span></div>
      <div class="benefit">${(c.top_benefit_summary||'').replace(/\|/g,' · ')}</div>
      <span class="more">자세히 보기 →</span>
    </a>`).join('') || '<div class="empty">조건에 맞는 카드가 없어요.</div>';
}
load();
</script>
</body>
</html>
